<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperComp – Navigation Diagram</title>
  <style>
    body { font-family: sans-serif; background: #0f1117; color: #e0e0e0; margin: 0; padding: 32px; }
    h1 { text-align: center; color: #4CAF50; font-size: 22px; margin-bottom: 4px; }
    p.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 32px; }
    svg { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>SuperComp 🛒 — Navigation Graph</h1>
  <p class="sub">Entregable 2 · Kotlin + Jetpack Compose Navigation</p>

  <svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#4CAF50" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#FF7043" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Background panels -->
    <!-- Auth zone -->
    <rect x="20" y="20" width="220" height="220" rx="14" fill="#1a1f2e" stroke="#2a3050" stroke-width="1"/>
    <text x="130" y="44" text-anchor="middle" fill="#5c7aff" font-size="11" font-weight="600" letter-spacing="1">AUTH ZONE</text>

    <!-- Main app zone -->
    <rect x="280" y="20" width="600" height="520" rx="14" fill="#141a14" stroke="#2a4a2a" stroke-width="1"/>
    <text x="580" y="44" text-anchor="middle" fill="#4CAF50" font-size="11" font-weight="600" letter-spacing="1">MAIN APP — requires login</text>

    <!-- ── Nodes ── -->

    <!-- Login -->
    <g>
      <rect x="40" y="68" width="160" height="62" rx="10" fill="#1e2a4a" stroke="#5c7aff" stroke-width="1.5"/>
      <text x="120" y="90" text-anchor="middle" fill="#5c7aff" font-size="13" font-weight="700">Login</text>
      <text x="120" y="107" text-anchor="middle" fill="#8899cc" font-size="10">route: login</text>
      <text x="120" y="120" text-anchor="middle" fill="#8899cc" font-size="10">⭐ pantalla inicial</text>
    </g>

    <!-- Register -->
    <g>
      <rect x="40" y="172" width="160" height="52" rx="10" fill="#1e2a4a" stroke="#5c7aff" stroke-width="1"/>
      <text x="120" y="194" text-anchor="middle" fill="#5c7aff" font-size="13" font-weight="700">Register</text>
      <text x="120" y="211" text-anchor="middle" fill="#8899cc" font-size="10">route: register</text>
    </g>

    <!-- Home -->
    <g>
      <rect x="320" y="58" width="170" height="76" rx="10" fill="#1a2e1a" stroke="#4CAF50" stroke-width="2"/>
      <text x="405" y="82" text-anchor="middle" fill="#4CAF50" font-size="14" font-weight="700">Home</text>
      <text x="405" y="99" text-anchor="middle" fill="#7aaa7a" font-size="10">home/{username}/{userId}</text>
      <text x="405" y="114" text-anchor="middle" fill="#7aaa7a" font-size="10">🏠 pantalla principal</text>
      <text x="405" y="127" text-anchor="middle" fill="#7aaa7a" font-size="10">args: username, userId</text>
    </g>

    <!-- Compare -->
    <g>
      <rect x="560" y="58" width="170" height="76" rx="10" fill="#1a2a2e" stroke="#26C6DA" stroke-width="1.5"/>
      <text x="645" y="82" text-anchor="middle" fill="#26C6DA" font-size="14" font-weight="700">Compare</text>
      <text x="645" y="99" text-anchor="middle" fill="#6aabbb" font-size="10">compare/{username}/{userId}</text>
      <text x="645" y="114" text-anchor="middle" fill="#6aabbb" font-size="10">🔍 buscar y comparar</text>
      <text x="645" y="127" text-anchor="middle" fill="#6aabbb" font-size="10">args: username, userId</text>
    </g>

    <!-- Shopping List -->
    <g>
      <rect x="320" y="230" width="170" height="76" rx="10" fill="#2e2a1a" stroke="#FFA726" stroke-width="1.5"/>
      <text x="405" y="254" text-anchor="middle" fill="#FFA726" font-size="13" font-weight="700">Shopping List</text>
      <text x="405" y="271" text-anchor="middle" fill="#bbaa6a" font-size="10">shoppinglist/{username}/{userId}</text>
      <text x="405" y="286" text-anchor="middle" fill="#bbaa6a" font-size="10">🛒 cesta y listas guardadas</text>
      <text x="405" y="299" text-anchor="middle" fill="#bbaa6a" font-size="10">args: username, userId</text>
    </g>

    <!-- Favourites -->
    <g>
      <rect x="560" y="230" width="170" height="76" rx="10" fill="#2e1a1a" stroke="#EF5350" stroke-width="1.5"/>
      <text x="645" y="254" text-anchor="middle" fill="#EF5350" font-size="14" font-weight="700">Favourites</text>
      <text x="645" y="271" text-anchor="middle" fill="#bb6a6a" font-size="10">favorites/{username}/{userId}</text>
      <text x="645" y="286" text-anchor="middle" fill="#bb6a6a" font-size="10">❤️ wishlist del usuario</text>
      <text x="645" y="299" text-anchor="middle" fill="#bb6a6a" font-size="10">args: username, userId</text>
    </g>

    <!-- Profile -->
    <g>
      <rect x="440" y="400" width="170" height="76" rx="10" fill="#2a1a2e" stroke="#CE93D8" stroke-width="1.5"/>
      <text x="525" y="424" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="700">Profile</text>
      <text x="525" y="441" text-anchor="middle" fill="#aa7abb" font-size="10">profile/{username}/{userId}</text>
      <text x="525" y="456" text-anchor="middle" fill="#aa7abb" font-size="10">👤 cuenta y ajustes</text>
      <text x="525" y="469" text-anchor="middle" fill="#aa7abb" font-size="10">args: username, userId</text>
    </g>

    <!-- ── Arrows ── -->

    <!-- Login → Home (success, popUpTo login) -->
    <line x1="200" y1="99" x2="318" y2="99" stroke="#4CAF50" stroke-width="2"
          marker-end="url(#arr)"/>
    <text x="258" y="92" text-anchor="middle" fill="#4CAF50" font-size="9">login OK</text>
    <text x="258" y="103" text-anchor="middle" fill="#4CAF50" font-size="9">popUpTo(login)</text>

    <!-- Login → Register -->
    <line x1="120" y1="130" x2="120" y2="170" stroke="#5c7aff" stroke-width="1.5"
          marker-end="url(#arr2)" stroke-dasharray="5 3"/>
    <text x="86" y="157" text-anchor="middle" fill="#8899cc" font-size="9">ir a registro</text>

    <!-- Register → Login (back / success) -->
    <path d="M200 198 Q240 198 240 145 Q240 105 200 105" fill="none" stroke="#888" stroke-width="1.2"
          stroke-dasharray="4 3" marker-end="url(#arr2)"/>
    <text x="256" y="155" text-anchor="middle" fill="#888" font-size="9">back /</text>
    <text x="256" y="166" text-anchor="middle" fill="#888" font-size="9">success</text>

    <!-- Bottom nav bar group line -->
    <line x1="405" y1="360" x2="405" y2="398" stroke="#444" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="645" y1="310" x2="645" y2="360" stroke="#444" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="490" y1="310" x2="490" y2="360" stroke="#444" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="730" y1="142" x2="730" y2="360" stroke="#444" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="405" y1="142" x2="405" y2="228" stroke="#444" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Bottom Nav Bar indicator -->
    <rect x="380" y="352" width="370" height="22" rx="11" fill="#1e2e1e" stroke="#4CAF50" stroke-width="1"/>
    <text x="565" y="367" text-anchor="middle" fill="#4CAF50" font-size="10" font-weight="600">
      🏠 Home · 🔍 Compare · ❤️ Saved · 🛒 Lists · 👤 Profile   — Bottom Navigation Bar
    </text>

    <!-- Home ↔ Compare (bottom nav) -->
    <path d="M490 96 L558 96" fill="none" stroke="#4CAF50" stroke-width="1.5"
          marker-end="url(#arr)"/>

    <!-- Profile → Login (logout) -->
    <path d="M440 450 Q300 450 300 480 Q300 510 200 510 Q80 510 80 350 Q80 240 80 198 L82 198"
          fill="none" stroke="#FF7043" stroke-width="1.5"
          stroke-dasharray="5 3" marker-end="url(#arr3)"/>
    <text x="172" y="505" text-anchor="middle" fill="#FF7043" font-size="9">logout → clearSession</text>
    <text x="172" y="516" text-anchor="middle" fill="#FF7043" font-size="9">popUpTo(login)</text>

    <!-- Legend -->
    <rect x="30" y="280" width="210" height="130" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="135" y="299" text-anchor="middle" fill="#888" font-size="10" font-weight="600">LEYENDA</text>

    <line x1="46" y1="315" x2="86" y2="315" stroke="#4CAF50" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="319" text-anchor="middle" fill="#aaa" font-size="10">Navegación principal</text>

    <line x1="46" y1="338" x2="86" y2="338" stroke="#5c7aff" stroke-width="1.5"
          stroke-dasharray="5 3" marker-end="url(#arr2)"/>
    <text x="175" y="342" text-anchor="middle" fill="#aaa" font-size="10">Navegación secundaria</text>

    <line x1="46" y1="361" x2="86" y2="361" stroke="#888" stroke-width="1.2"
          stroke-dasharray="4 3" marker-end="url(#arr2)"/>
    <text x="168" y="365" text-anchor="middle" fill="#aaa" font-size="10">Volver / back stack</text>

    <line x1="46" y1="384" x2="86" y2="384" stroke="#FF7043" stroke-width="1.5"
          stroke-dasharray="5 3" marker-end="url(#arr3)"/>
    <text x="161" y="388" text-anchor="middle" fill="#aaa" font-size="10">Logout / clear session</text>

    <!-- Argument label -->
    <rect x="300" y="490" width="420" height="30" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <text x="510" y="510" text-anchor="middle" fill="#888" font-size="10">
      Todas las rutas principales reciben: username: String (req) · userId: String (req)
    </text>
  </svg>
</body>
</html>
